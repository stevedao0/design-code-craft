<!doctype html><html lang="vi" class="theme-dark-gold"><head><meta charset="utf-8">
<link rel="stylesheet" href="/src/theme/tokens.css"><link rel="stylesheet" href="/src/theme/command-os.css">
<style>body{margin:0}</style></head><body>
<div class="vcpmc-shell">
 <aside class="vcpmc-rail">
   <div class="vcpmc-rail__top"><button class="vcpmc-orb"><img class="vcpmc-orb__logo" src="/brand/vcpmc-logo.png" onerror="this.style.background='#4A7202';this.removeAttribute('src')"></button></div>
   <div class="vcpmc-rail__nav">
     <button class="vcpmc-rail__item is-active"><svg class="vcpmc-rail__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
     <button class="vcpmc-rail__item"><svg class="vcpmc-rail__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/></svg></button>
     <button class="vcpmc-rail__item"><svg class="vcpmc-rail__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
   </div>
   <div class="vcpmc-rail__bottom"><button class="vcpmc-rail__item vcpmc-rail__item--danger"><svg class="vcpmc-rail__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M10 4H6v16h4M16 8l4 4-4 4M20 12H10"/></svg></button></div>
 </aside>
 <div class="vcpmc-shell__main">
  <header class="vcpmc-ribbon"><div class="vcpmc-ribbon__inner">
    <div class="vcpmc-ribbon__brand-zone">
      <span class="vcpmc-ribbon__wordmark"><span class="vcpmc-ribbon__wordmark-main">VCPMC</span><span class="vcpmc-ribbon__wordmark-sub">Licensing Department</span></span>
      <button class="vcpmc-ribbon__back"><svg class="vcpmc-ribbon__back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 6l-6 6 6 6"/></svg></button>
      <nav class="vcpmc-ribbon__breadcrumb"><button class="vcpmc-ribbon__crumb">VCPMC</button><span class="vcpmc-ribbon__group">Hợp đồng</span><span class="vcpmc-ribbon__label">Danh sách hợp đồng</span></nav>
    </div>
    <button class="vcpmc-ribbon__hint"><span class="vcpmc-ribbon__hint-text">Tìm trang, hành động...</span><kbd class="vcpmc-ribbon__hint-kbd">⌘K</kbd></button>
    <div class="vcpmc-ribbon__right"><button class="vcpmc-header-action"><span class="vcpmc-header-action__label">Bảng tính</span></button><span class="vcpmc-ribbon__date"><span class="vcpmc-ribbon__date-wd">T4</span><span class="vcpmc-ribbon__date-dm">18/02</span></span><span class="vcpmc-ribbon__avatar">AD</span></div>
  </div></header>
  <div class="vcpmc-shell__workspace"><div style="padding:24px">Nội dung</div></div>
 </div>
</div></body></html>
