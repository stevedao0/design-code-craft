<div class="vcpmc-shell">
  <aside class="vcpmc-rail" aria-label="Main navigation">
    <div class="vcpmc-rail__top">
      <button type="button" class="vcpmc-orb" aria-label="Open command">
        <svg class="vcpmc-orb__logo" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#6fae29"/></svg>
      </button>
    </div>
    <nav class="vcpmc-rail__nav" aria-label="Primary">
      <button class="vcpmc-rail__item is-active" aria-label="Dashboard" title="Dashboard">DB</button>
      <button class="vcpmc-rail__item" aria-label="Contracts" title="Contracts">CT</button>
      <button class="vcpmc-rail__item" aria-label="Reports" title="Reports">RP</button>
    </nav>
    <div class="vcpmc-rail__bottom">
      <button class="vcpmc-rail__item" aria-label="Settings" title="Settings">ST</button>
    </div>
  </aside>
  <div class="vcpmc-shell__main">
    <header class="vcpmc-ribbon" aria-label="Command ribbon">
      <div class="vcpmc-ribbon__inner">
        <div class="vcpmc-ribbon__brand-zone">
          <button type="button" class="vcpmc-ribbon__back" aria-label="Back" title="Back">
            <svg class="vcpmc-ribbon__back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          </button>
          <nav class="vcpmc-ribbon__breadcrumb" aria-label="Current location">
            <span class="vcpmc-ribbon__group">Tổng quan</span>
            <svg class="vcpmc-ribbon__sep" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            <span class="vcpmc-ribbon__label" aria-current="page">Bảng điều khiển</span>
          </nav>
        </div>
        <div class="vcpmc-ribbon__right">
          <div class="vcpmc-tray">
            <button type="button" class="vcpmc-tray__action" aria-label="Calculator" title="Calculator">
              <svg class="vcpmc-tray__action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M16 10l-8 8m0-8l8 8"/></svg>
              <span class="vcpmc-tray__action-label">Bảng tính</span>
            </button>
            <span class="vcpmc-tray__clock" title="14:32 · 31-07-2026">
              <span class="vcpmc-tray__time">14:32</span>
              <span class="vcpmc-tray__date">31-07-2026</span>
            </span>
            <span class="vcpmc-tray__divider" aria-hidden="true"></span>
            <span class="vcpmc-ribbon__avatar" title="admin@vcpmc.org">TD</span>
          </div>
        </div>
      </div>
    </header>
    <main class="vcpmc-shell__workspace">
      <div class="vcpmc-shell__workspace-inner page-enter" style="padding:24px">
        <div style="height:300px; border-radius:12px; background:var(--surface-primary, #f6f4ef)"></div>
      </div>
    </main>
  </div>
</div>
