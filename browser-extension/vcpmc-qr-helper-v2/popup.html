<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #1a1a1a;
      font-size: 13px;
    }

    /* ── Header ── */
    .header {
      background: #1d4ed8;
      color: #fff;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon {
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.18);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700;
      flex-shrink: 0;
    }
    .header-text h1 { font-size: 13px; font-weight: 600; line-height: 1.3; }
    .header-text p { font-size: 10px; opacity: 0.75; margin-top: 1px; }

    /* ── Status badges ── */
    .status-row {
      display: flex; gap: 5px; flex-wrap: wrap;
      padding: 7px 14px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      font-size: 11px;
    }
    .badge {
      display: flex; align-items: center; gap: 4px;
      padding: 2px 8px;
      border-radius: 20px; font-weight: 500;
    }
    .badge .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .badge.green { background: #f0fdf4; color: #15803d; }
    .badge.green .dot { background: #16a34a; }
    .badge.red { background: #fef2f2; color: #b91c1c; }
    .badge.red .dot { background: #dc2626; }
    .badge.yellow { background: #fffbeb; color: #92400e; }
    .badge.yellow .dot { background: #d97706; }
    .badge.blue { background: #eff6ff; color: #1d4ed8; }
    .badge.blue .dot { background: #2563eb; }

    /* ── Data summary ── */
    .data-summary {
      padding: 8px 14px;
      background: #eff6ff;
      border-bottom: 1px solid #bfdbfe;
      font-size: 11px;
    }
    .data-summary .label { font-weight: 600; color: #1e40af; margin-bottom: 3px; }
    .data-summary .row { display: flex; gap: 4px; margin-bottom: 1px; }
    .data-summary .key { color: #64748b; min-width: 70px; flex-shrink: 0; }
    .data-summary .val { color: #1e3a5f; font-family: monospace; font-size: 10.5px; word-break: break-all; }

    /* ── Mapping summary ── */
    .mapping-summary {
      padding: 5px 14px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 11px;
      display: none;
    }
    .mapping-summary.show { display: block; }
    .mapping-summary .ok { color: #16a34a; font-weight: 600; }
    .mapping-summary .warn { color: #d97706; font-weight: 600; }
    .mapping-summary .err { color: #dc2626; font-weight: 600; }
    .mapping-summary .sep { color: #94a3b8; margin: 0 4px; }

    /* ── Actions ── */
    .actions {
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .btn-row { display: flex; gap: 5px; }
    .btn-row .btn { flex: 1; }

    .btn {
      padding: 8px 10px;
      border-radius: 6px;
      border: none;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      transition: background 0.12s, opacity 0.12s;
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary { background: #1d4ed8; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #1e40af; }

    .btn-secondary { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
    .btn-secondary:hover:not(:disabled) { background: #e2e8f0; }

    .btn-scan { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
    .btn-scan:hover:not(:disabled) { background: #fef3c7; }

    .btn-preview { background: #f5f3ff; color: #6d28d9; border: 1px solid #ddd6fe; }
    .btn-preview:hover:not(:disabled) { background: #ede9fe; }

    .btn-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .btn-danger:hover:not(:disabled) { background: #fee2e2; }

    /* ── Result ── */
    .result-box {
      margin: 0 14px 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
      max-height: 200px;
      overflow-y: auto;
    }
    .result-box.show { display: block; }
    .result-box.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
    .result-box.error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .result-box.info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
    .result-box.warning { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
    .result-box pre {
      white-space: pre-wrap; word-break: break-all;
      font-size: 11px; font-family: monospace; line-height: 1.5; padding: 8px;
    }

    /* ── Mapping table ── */
    .mapping-table {
      margin: 0 14px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 11px;
      display: none;
      overflow: hidden;
    }
    .mapping-table.show { display: block; }
    .mapping-table table { width: 100%; border-collapse: collapse; }
    .mapping-table tr { border-bottom: 1px solid #f1f5f9; }
    .mapping-table tr:last-child { border-bottom: none; }
    .mapping-table td { padding: 4px 8px; vertical-align: top; }
    .mapping-table td:first-child { color: #64748b; white-space: nowrap; width: 130px; }
    .mapping-table td:last-child { color: #1e293b; word-break: break-all; }
    .mapping-table .ok td:last-child { color: #16a34a; }
    .mapping-table .warn td:last-child { color: #d97706; }
    .mapping-table .err td:last-child { color: #dc2626; }
    .mapping-table .skip td:last-child { color: #94a3b8; font-style: italic; }
    .badge-req { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 9px; font-weight: 600; background: #dbeafe; color: #1d4ed8; margin-left: 3px; }
    .badge-opt { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 9px; font-weight: 600; background: #f3e8ff; color: #7c3aed; margin-left: 3px; }

    /* ── Footer ── */
    .footer {
      padding: 6px 14px;
      border-top: 1px solid #e2e8f0;
      font-size: 10px;
      color: #94a3b8;
      text-align: center;
    }

    .loading {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid rgba(255,255,255,0.5); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-icon">QR</div>
    <div class="header-text">
      <h1>VCPMC QR Portal Assistant</h1>
      <p>Ho tro dien popup QR · v2.2</p>
    </div>
  </div>

  <!-- Status row -->
  <div class="status-row">
    <div class="badge yellow" id="extBadge">
      <span class="dot"></span>
      <span id="extStatus">Đang kiểm tra...</span>
    </div>
    <div class="badge yellow" id="popupBadge" style="display:none">
      <span class="dot"></span>
      <span id="popupStatus">Chưa kiểm tra</span>
    </div>
  </div>

  <!-- Data summary -->
  <div class="data-summary" id="dataSummary" style="display:none">
    <div class="label">Thông tin đang chờ điền</div>
    <div class="row"><span class="key">Số HĐ:</span><span class="val" id="pContractNo">-</span></div>
    <div class="row"><span class="key">Số GCN:</span><span class="val" id="pCertNo">-</span></div>
    <div class="row"><span class="key">Đơn vị:</span><span class="val" id="pOrgName">-</span></div>
  </div>

  <!-- Mapping summary (inline) -->
  <div class="mapping-summary" id="mappingSummary"></div>

  <!-- Actions -->
  <div class="actions">
    <div class="btn-row">
      <button class="btn btn-primary" id="btnFill" disabled>
        Điền vào popup đang mở
      </button>
      <button class="btn btn-secondary" id="btnOpenPortal">
        Mở QR Portal
      </button>
    </div>
    <div class="btn-row">
      <button class="btn btn-scan" id="btnScan">
        Kiểm tra popup
      </button>
      <button class="btn btn-preview" id="btnPreview">
        Xem trước dữ liệu
      </button>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btnCopyJson">
        Sao chép log kỹ thuật
      </button>
      <button class="btn btn-danger" id="btnClear">
        Xóa dữ liệu tạm
      </button>
    </div>
  </div>

  <!-- Mapping table -->
  <div class="mapping-table" id="mappingTable"></div>

  <!-- Result -->
  <div class="result-box" id="resultBox"></div>

  <!-- Footer -->
  <div class="footer">
    Không tự bấm Lưu · Không gọi API Portal · Dữ liệu chỉ trên máy này
  </div>

  <script src="popup.js"></script>
</body>
</html>
